group = "com.zzxap.chess_ai_ffi"
version = "1.0"
apply plugin: "com.android.library"
android {
    namespace "com.zzxap.chess_ai_ffi"
    compileSdk 36
    defaultConfig {
        minSdk 24
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    sourceSets.main.jniLibs.srcDirs = ["src/main/jniLibs"]
}
