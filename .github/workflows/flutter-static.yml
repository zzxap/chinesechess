name: Flutter FFI generation and static analysis

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-static.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install libclang
        run: sudo apt-get update -qq && sudo apt-get install -y libclang-18-dev
      - name: Install matching Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter-sdk"
          git -C "$RUNNER_TEMP/flutter-sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter-sdk" fetch --depth 1 origin refs/tags/3.47.7:refs/tags/3.47.7
          git -C "$RUNNER_TEMP/flutter-sdk" checkout -b stable refs/tags/3.47.7
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Resolve Flutter packages
        working-directory: flutter
        run: |
          flutter config --no-analytics
          cp ../Pikafish/pikafish.nnue assets/ai/model.nnue
          flutter pub get
      - name: Generate FFI bindings from C header
        id: ffigen
        working-directory: flutter
        run: |
          cp ffigen.yaml ffigen_ci.yaml
          printf '\nllvm-path:\n  - /usr/lib/llvm-18\n' >> ffigen_ci.yaml
          dart run ffigen --config ffigen_ci.yaml
          dart format lib
      - name: Analyze Dart without running tests
        working-directory: flutter
        run: |
          set -o pipefail
          if flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"; then
            exit 0
          else
            python3 ../scripts/ci/report-build-error.py "$RUNNER_TEMP/flutter-analyze.log"
            exit 1
          fi
      - name: Commit generated bindings and Dart formatting
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter/lib flutter/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Flutter FFI bindings and format Dart sources'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.ffigen.outcome == 'success'
        with:
          name: flutter-ffi-bindings
          path: flutter/lib/ai/bindings.dart
          retention-days: 3
