name: chinesechess
description: 中国象棋，Dart 界面与离线 FFI AI。
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  chess_ai_ffi:
    path: packages/chess_ai_ffi
dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/chess/
    - assets/chess/pieces/
    - assets/app-icon/app-icon-1024.png
    - assets/ai/model.nnue
    - licenses/
